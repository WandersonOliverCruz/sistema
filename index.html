<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Chamados e Equipamentos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Gestão de Chamados e Equipamentos</h1>
    </header>

    <main>
        <!-- Seção de Equipamentos -->
        <section id="secao-equipamentos">
            <h2>Equipamentos</h2>
            
            <!-- Formulário para Cadastrar Equipamento -->
            <form id="form-equipamento">
                <h3>Cadastrar Equipamento</h3>
                <input type="text" id="eq-patrimonio" placeholder="Patrimônio" required>
                <input type="text" id="eq-tipo" placeholder="Tipo (ex: Computador, Impressora)" required>
                <input type="text" id="eq-marca" placeholder="Marca / Modelo" required>
                <input type="text" id="eq-setor" placeholder="Setor" required>
                <input type="text" id="eq-responsavel" placeholder="Responsável" required>
                <select id="eq-status">
                    <option value="Ativo">Ativo</option>
                    <option value="Inativo">Inativo</option>
                    <option value="Em Manutenção">Em Manutenção</option>
                </select>
                <button type="submit">Cadastrar Equipamento</button>
            </form>

            <!-- Tabela de Listagem de Equipamentos -->
            <h3>Lista de Equipamentos</h3>
            <table>
                <thead>
                    <tr>
                        <th>Patrimônio</th>
                        <th>Tipo</th>
                        <th>Marca/Modelo</th>
                        <th>Setor</th>
                        <th>Responsável</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tabela-equipamentos">
                    <!-- Preenchido via JavaScript -->
                </tbody>
            </table>
        </section>

        <hr>

        <!-- Seção de Chamados -->
        <section id="secao-chamados">
            <h2>Chamados</h2>

            <!-- Formulário para Criar Chamado -->
            <form id="form-chamado">
                <h3>Novo Chamado</h3>
                <input type="text" id="ch-solicitante" placeholder="Solicitante" required>
                <input type="text" id="ch-categoria" placeholder="Categoria (ex: Suporte, Erro)" required>
                <textarea id="ch-descricao" placeholder="Descrição do problema" required></textarea>
                <select id="ch-prioridade">
                    <option value="Baixa">Baixa</option>
                    <option value="Média" selected>Média</option>
                    <option value="Alta">Alta</option>
                </select>
                <button type="submit">Abrir Chamado</button>
            </form>

            <!-- Tabela de Listagem de Chamados -->
            <h3>Lista de Chamados</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Solicitante</th>
                        <th>Categoria</th>
                        <th>Descrição</th>
                        <th>Prioridade</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tabela-chamados">
                    <!-- Preenchido via JavaScript -->
                </tbody>
            </table>
        </section>
    </main>

    <!-- 1º CARREGA A CAIXA DE FERRAMENTAS DO SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 2º CARREGA O SEU CÓDIGO -->
    <script src="script.js"></script>
</body>
</html>
